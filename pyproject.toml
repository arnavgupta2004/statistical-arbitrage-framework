[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statarb-research"
version = "0.1.0"
description = "Research framework for testing whether equity statistical-arbitrage relationships survive selection bias, costs and out-of-sample evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "lxml>=5",
    "pyyaml>=6",
    "pydantic>=2.7",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["statarb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"experiments/*" = ["E501"]  # report scripts print wide tables
"statarb/data/cli.py" = ["E501"]
